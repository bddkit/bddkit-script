name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The host the plugin is tested against: a released bddkit, installed from
  # its tag and never from a floating branch, so a red run means this plugin
  # broke. Raise it when a newer release is out.
  HOST_TAG: v0.5.0

jobs:
  test:
    name: test & clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # Pinned on purpose: a floating stable's new clippy lint must never
      # redden a PR that has nothing to do with it.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.97.1"
          components: clippy, rustfmt
          rustflags: ""
      - run: cargo fmt --check
      - name: File size budget
        run: |
          files=$(git ls-files '*.rs' '*.feature' '*.yaml' '*.yml' ':!.github/')
          status=0
          while IFS= read -r file; do
            lines=$(wc -l < "$file")
            if [ "$lines" -gt 1000 ]; then
              echo "::error file=$file::$lines lines, the limit is 1000"
              status=1
            fi
          done <<< "$files"
          exit "$status"
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --locked

  # Drives the plugin through the host built from HOST_TAG; without BDDKIT_BIN
  # these tests skip themselves.
  e2e:
    name: e2e against bddkit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.97.1"
          rustflags: ""

      - name: Cache the host
        id: host
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/bddkit-host
          key: bddkit-host-${{ env.HOST_TAG }}-${{ runner.os }}
      - name: Install bddkit
        if: steps.host.outputs.cache-hit != 'true'
        shell: bash
        run: >-
          cargo install --git https://github.com/bddkit/bddkit --tag "$HOST_TAG"
          --locked --root "$RUNNER_TEMP/bddkit-host" bddkit
      - name: Use the host
        shell: bash
        run: |
          echo "$RUNNER_TEMP/bddkit-host/bin" >> "$GITHUB_PATH"
          exe=; [ "$RUNNER_OS" = Windows ] && exe=.exe
          echo "BDDKIT_BIN=$RUNNER_TEMP/bddkit-host/bin/bddkit$exe" >> "$GITHUB_ENV"

      - name: End-to-end tests
        run: cargo test --locked --test e2e
