[package]
name = "bddkit-script"
version = "0.2.0"
edition = "2024"
rust-version = "1.97"
description = "Rhai script steps for the bddkit acceptance-testing tool: derive values (Base64, HMAC, JWT) from the file's variables"
license = "Apache-2.0"
repository = "https://github.com/bddkit/bddkit-script"
homepage = "https://github.com/bddkit/bddkit-script"
readme = "README.md"
keywords = ["bdd", "gherkin", "testing", "scripting", "bddkit"]
categories = ["development-tools::testing"]
exclude = ["/.github", "/.idea", "/docs"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
rhai = { version = "1.27", features = ["no_time", "no_module", "internals", "metadata"] }
serde_json = "1.0"

[dev-dependencies]
regex = "1"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
clone_on_ref_ptr = "warn"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
# noise for this project
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow"
format_push_string = "allow"
